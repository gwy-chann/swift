# ==============================================================================
# SWIFT Strangler Fig Architecture Local Orchestration
# Services:
#   1. strangler-gateway: NGINX Reverse Proxy (Port 80)
#   2. swift-backend:     Spring Boot 3.3 Modular Monolith (Port 8080)
# ==============================================================================

services:
  strangler-gateway:
    image: nginx:1.27-alpine
    container_name: swift-strangler-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx-strangler-gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      swift-backend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - swift-network

  swift-backend:
    build:
      context: ./swift-backend
      dockerfile: Dockerfile
    container_name: swift-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DATABASE_URL=${SPRING_DATABASE_URL:-jdbc:postgresql://host.docker.internal:54422/postgres?sslmode=prefer}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - NEXT_PUBLIC_SUPABASE_URL=${SPRING_SUPABASE_URL:-http://host.docker.internal:54421}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - swift-network

networks:
  swift-network:
    driver: bridge
