spring:
  application:
    name: swift-backend-test
  datasource:
    url: jdbc:h2:mem:swifttest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DEFAULT_LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  threads:
    virtual:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

swift:
  auth:
    supabase-url: http://localhost:54321
    jwks-url: http://localhost:54321/auth/v1/.well-known/jwks.json
    admin-elevation-password: admin123
    admin-elevation-pin: "8888"

