# ==============================================================================
# SWIFT Strangler Reverse-Proxy Gateway Configuration
# Reference: SIAA-88 (Phase 0) / SIAA-98 (Phase 6: Shadow Parity & Canary Cutover)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Logging format with upstream response tracking & shadow telemetry
    log_format strangler '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" rt=$request_time '
                         'upstream=$upstream_addr ustatus=$upstream_status '
                         'utime=$upstream_response_time fallback=$sent_http_x_swift_fallback '
                         'canary=$sent_http_x_swift_canary_stage';

    access_log /var/log/nginx/access.log strangler;
    error_log  /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Upstream Backends
    # --------------------------------------------------------------------------
    upstream nextjs_backend {
        # Active Next.js frontend & server actions
        server host.docker.internal:3000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3000 backup;
    }

    upstream springboot_backend {
        # Target Spring Boot 3.3 modular monolith
        server swift-backend:8080 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8080 backup;
    }

    # --------------------------------------------------------------------------
    # Dynamic Canary Upstream Pool (Configurable: 10%, 25%, 50%, 80%, 100%)
    # Stage 100: Full production cutover with Next.js remaining as fallback
    # --------------------------------------------------------------------------
    upstream canary_pool {
        server swift-backend:8080 weight=100 max_fails=2 fail_timeout=5s;
        server host.docker.internal:3000 backup;
        server 127.0.0.1:8080 backup;
    }

    server {
        listen 80;
        server_name localhost pos.swiftparts.local;

        # Standard Forwarded Headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Default Canary Telemetry Indicator
        add_header X-Swift-Canary-Stage "STAGE_100" always;

        # ----------------------------------------------------------------------
        # Dark Traffic Shadow Subrequest (Asynchronous Read Mirroring)
        # Clones read traffic to Spring Boot shadow out-of-band with 0ms added TTFB
        # ----------------------------------------------------------------------
        location = /shadow {
            internal;
            proxy_pass http://springboot_backend$request_uri;
            proxy_pass_request_body off;
            proxy_set_header X-Swift-Shadow "true";
            proxy_set_header Content-Length "";
            proxy_ignore_client_abort on;
            proxy_intercept_errors off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # ----------------------------------------------------------------------
        # 1. Spring Boot Actuator Observability & Prometheus Probes
        # ----------------------------------------------------------------------
        location /actuator/ {
            proxy_pass http://springboot_backend;
            proxy_intercept_errors off;
        }

        # ----------------------------------------------------------------------
        # 2. Migrated API Endpoints (Canary Routed with Dark Shadow Mirroring)
        # ----------------------------------------------------------------------

        # Phase 2: MotoMatcher Compatibility Engine
        location /api/v1/motomatcher/ {
            mirror /shadow;
            mirror_request_body off;
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        # Phase 3: Master Product Catalog & Physical Locator
        location /api/v1/admin/products {
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        # Phase 3: Transactional Stock Adjustment Engine
        location /api/v1/inventory/ {
            mirror /shadow;
            mirror_request_body off;
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        # Phase 3: Global Pricing Markup Rules
        location /api/v1/pricing/rules {
            mirror /shadow;
            mirror_request_body off;
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        # Phase 3: Workshop Bay Labor Rates & Flat-Rate Service Schedule
        location /api/v1/services/labor {
            mirror /shadow;
            mirror_request_body off;
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        # Phase 3: Staff Account Provisioning & Granular RBAC
        location /api/v1/admin/users {
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        # Phase 3: Forensic Security Audit Trail & Compliance Export
        location /api/v1/admin/audit {
            mirror /shadow;
            mirror_request_body off;
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        # Phase 4: Employee Shift Attendance & Digital Punch Clock
        location /api/v1/shifts/ {
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        location /api/v1/staff/ {
            mirror /shadow;
            mirror_request_body off;
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        # Phase 4: High-Concurrency POS Checkout Orchestration & Thermal Receipts
        location /api/v1/pos/ {
            mirror /shadow;
            mirror_request_body off;
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        # Phase 5: High-Performance Executive Analytics Virtual Threads & Streamed CSV
        location /api/v1/analytics/ {
            mirror /shadow;
            mirror_request_body off;
            proxy_pass http://canary_pool;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            error_page 502 503 504 = @fallback_to_nextjs;
        }

        # ----------------------------------------------------------------------
        # 3. Fallback Route: Sub-second reroute to Next.js with telemetry header
        # ----------------------------------------------------------------------
        location @fallback_to_nextjs {
            add_header X-Swift-Fallback "true" always;
            add_header X-Swift-Canary-Stage "FALLBACK" always;
            proxy_pass http://nextjs_backend;
        }

        # ----------------------------------------------------------------------
        # 4. Default Route: All unmigrated traffic passes to Next.js
        # (App Router pages, static assets, and active frontend shell)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://nextjs_backend;
        }
    }
}
